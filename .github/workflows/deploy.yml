name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fsldk.or.id/api/v1/public/news
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/fsldk-api
            git fetch origin main
            git reset --hard origin/main
            export PATH=$PATH:/usr/local/go/bin
            go build -o fsldk-api .
            systemctl restart fsldk-api
            sleep 2
            systemctl is-active fsldk-api

      - name: Health check
        run: |
          curl -sf https://fsldk.or.id/api/v1/public/news -o /dev/null
          echo "API OK"
